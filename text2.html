<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        /* Header */
        header {
            background: #0d6efd;
            color: white;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: yellow;
        }

        /* Hero Section */
        .hero {
            background: url('https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=1200') center/cover;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero h2 {
            font-size: 50px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
        }

        /* Products */
        .products {
            padding: 50px;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 35px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
            text-align: center;
        }

        .card-content h3 {
            margin-bottom: 10px;
        }

        .price {
            color: green;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn:hover {
            background: #084298;
        }

        /* Footer */
        footer {
            background: #212529;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ShopEasy</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to Our Online Store</h2>
    </section>

    <section class="products">
        <h2>Featured Products</h2>

        <div class="product-grid">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1000" alt="Shoes">
                <div class="card-content">
                    <h3>Sports Shoes</h3>
                    <p class="price">$59</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1000" alt="Watch">
                <div class="card-content">
                    <h3>Smart Watch</h3>
                    <p class="price">$120</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1000" alt="Phone">
                <div class="card-content">
                    <h3>Mobile Phone</h3>
                    <p class="price">$499</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=1000" alt="T-Shirt">
                <div class="card-content">
                    <h3>Fashion T-Shirt</h3>
                    <p class="price">$25</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 ShopEasy Online Shopping Website</p>
    </footer>

</body>

</html>
